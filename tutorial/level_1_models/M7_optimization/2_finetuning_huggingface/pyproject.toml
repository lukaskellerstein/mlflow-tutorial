[project]
name = "mlflow-tutorial-L1-M7-2-finetuning-huggingface"
version = "0.1.0"
description = "LLM Fine-Tuning with HuggingFace + MLflow"
requires-python = ">=3.10"
dependencies = [
    "mlflow>=3.0",
    "transformers>=4.30",
    "datasets>=2.0",
    "torch>=2.0",
    "accelerate>=0.20",  # required by transformers Trainer for PyTorch training
    "pandas>=2.0",
]

[tool.basedpyright]
typeCheckingMode = "standard"
# mlflow lazy-loads its flavor submodules (mlflow.langchain, mlflow.genai,
# mlflow.openai, ...). They exist at runtime but are not statically re-exported,
# so the type checker reports them as private imports. Suppress that only.
reportPrivateImportUsage = "none"
# mlflow.ActiveRun.__exit__ returns `exc_type is None` (declared `bool`), so the
# checker must assume `with mlflow.start_run()` may swallow an exception and skip
# its body -- flagging every variable assigned inside as possibly unbound. It
# never actually suppresses (it returns False whenever an exception is live).
reportPossiblyUnboundVariable = "none"
# MLflow base hooks (PythonModel.predict, RunContextProvider.in_context/tags)
# have no return annotation and empty bodies, so the checker infers `None` and
# rejects every override that actually returns a value.
reportIncompatibleMethodOverride = "none"
